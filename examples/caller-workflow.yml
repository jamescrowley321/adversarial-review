# Adversarial Review — consumer workflow.
#
# Copy this to `.github/workflows/adversarial-review.yml`. Add repo secret
# OPENROUTER_API_KEY, then require the "Merge Gate" check in branch protection.
#
# TOGGLE STEPS in the `ENABLED` list in the `config` job below: comment a line to
# disable a lens, uncomment one to enable it. That single list drives BOTH the
# parallel review matrix AND the gate — one source of truth.
#
# Pin the action to a released tag (or a commit SHA for OpenSSF Scorecard).

name: Adversarial Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]

concurrency:
  group: adversarial-review-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  checks: write
  issues: read        # the Compliance lens reads the PR thread (get_issue_or_pr_thread)

jobs:
  # ── Config: the ONE place to toggle lenses. Emits the enabled set as a matrix
  #    (for parallel review jobs) and as a CSV (for the gate). ──
  config:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
      csv: ${{ steps.pick.outputs.csv }}
    steps:
      - id: pick
        shell: node {0}
        env:
          ENABLED: |
            blind          # logic bugs, footguns (zero context)
            edge-case      # unhandled branches / boundaries
            acceptance     # PR acceptance criteria met + tested
            sentinel       # exploitable security vulnerabilities
            viper          # red-team attack paths (auth/infra only)
            compliance     # AI-provenance policy + your own rules
            # owasp-web    # OWASP Web Top 10 (2021) — optional, runs in parallel
            # owasp-llm    # OWASP GenAI/LLM Top 10 (2026) — optional, for LLM apps
        run: |
          const NAMES = {
            blind: "Blind Hunter", "edge-case": "Edge Case Hunter",
            acceptance: "Acceptance Auditor", sentinel: "Sentinel", viper: "Viper",
            compliance: "Compliance Auditor", "owasp-web": "OWASP Web Top 10",
            "owasp-llm": "OWASP LLM Top 10",
          };
          const keys = (process.env.ENABLED || "").split("\n")
            .map((l) => l.replace(/#.*/, "").trim()).filter(Boolean);
          if (keys.length === 0) throw new Error("At least one review lens must be enabled");
          const unknown = keys.filter((k) => !NAMES[k]);
          if (unknown.length > 0) throw new Error(`Unknown review lenses: ${unknown.join(", ")}`);
          const include = keys.map((k) => ({ lens: k, name: NAMES[k] }));
          const fs = require("fs");
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `matrix=${JSON.stringify({ include })}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `csv=${keys.join(",")}\n`);

  # Deterministic gate: the paid lenses (review) `needs:` this, so they never run
  # unless the cheap checks pass first. The fork/bot gate lives here and cascades.
  # Don't spend on fork PRs (they get no secret anyway) or Dependabot. Outside
  # contributors are gated by the repo setting "Require approval for all outside
  # collaborators" — NOT by author_association (the event reports CONTRIBUTOR for
  # org members, which would wrongly skip their PRs).
  preflight:
    name: Preflight
    runs-on: ubuntu-latest
    timeout-minutes: 12
    if: >-
      github.event.pull_request.head.repo.fork == false &&
      github.actor != 'dependabot[bot]'
    permissions:
      checks: read
      contents: read
      pull-requests: read
    steps:
      - name: Wait for deterministic checks
        uses: jamescrowley321/adversarial-review@v1
        with:
          mode: preflight
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # EXACT check-run names that must pass before the lenses run — edit per repo.
          required_checks: "lint, typecheck, build, secret-scan"

  review:
    name: ${{ matrix.name }}
    needs: [config, preflight]
    runs-on: ubuntu-latest
    # Lenses run in PARALLEL (one job per lens). The agent never posts the review
    # itself — it emits findings as JSON and the action posts via Octokit
    # deterministically — so concurrent-load tool-call flakes are no longer a risk.
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.config.outputs.matrix) }}
    steps:
      - name: ${{ matrix.name }}
        uses: jamescrowley321/adversarial-review@v1
        with:
          mode: lens
          lens: ${{ matrix.lens }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          api_key: ${{ secrets.OPENROUTER_API_KEY }}
          # Default is the pinned anthropic/claude-sonnet-5. Enforce the ZDR floor on
          # the request so it routes to a Zero-Data-Retention endpoint (Bedrock/Vertex).
          # JSON for pi's ~/.pi/agent/models.json; omit to fall back to account settings,
          # or set `model:` to pin a different slug.
          models_config: |
            {
              "providers": {
                "openrouter": {
                  "modelOverrides": {
                    "anthropic/claude-sonnet-5": {
                      "compat": { "openRouterRouting": { "zdr": true, "data_collection": "deny" } }
                    }
                  }
                }
              }
            }

  gate:
    name: Merge Gate
    needs: [config, preflight, review]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Record exempt PR
        if: github.event.pull_request.head.repo.fork == true || github.actor == 'dependabot[bot]'
        run: echo "Adversarial review is intentionally exempt for fork and Dependabot PRs."
      - name: Fail closed when prerequisites did not succeed
        if: >-
          github.event.pull_request.head.repo.fork == false &&
          github.actor != 'dependabot[bot]' &&
          (needs.config.result != 'success' || needs.preflight.result != 'success' || needs.review.result != 'success')
        env:
          CONFIG_RESULT: ${{ needs.config.result }}
          PREFLIGHT_RESULT: ${{ needs.preflight.result }}
          REVIEW_RESULT: ${{ needs.review.result }}
        run: |
          echo "::error::Adversarial review prerequisites did not succeed (config=$CONFIG_RESULT, preflight=$PREFLIGHT_RESULT, review=$REVIEW_RESULT)."
          exit 1
      - name: Adjudicate lenses
        if: >-
          github.event.pull_request.head.repo.fork == false &&
          github.actor != 'dependabot[bot]' &&
          needs.config.result == 'success' && needs.preflight.result == 'success' && needs.review.result == 'success'
        uses: jamescrowley321/adversarial-review@v1
        with:
          mode: gate
          lenses: ${{ needs.config.outputs.csv }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
