# Adversarial Review — a fresh-context, diff-only AI review gate.
#
# One composite action, two modes:
#   mode: lens  — run ONE adversarial persona as a fresh agent session. The
#                 agent emits findings as JSON (its final message); the action
#                 parses it, renders the `## <Lens>` review body, and posts the
#                 PR review DETERMINISTICALLY via Octokit (the agent never calls
#                 the GitHub write API). No automatic retry — a flaky/empty model
#                 output fails THIS lens job so a human re-runs it.
#   mode: gate  — aggregate the lens reviews on the head commit and fail closed
#                 (blocking merge) if any lens requested changes or is missing.
#
# The caller runs `mode: lens` as a matrix (one job per lens, in parallel) and a
# final `mode: gate` job that `needs:` them. See examples/caller-workflow.yml.
#
# Engine: the pi coding agent (pi.dev) via shaftoe/pi-coding-agent-action,
# routed through OpenRouter (default model z-ai/glm-5.2). All overridable.

name: 'Adversarial Review'
description: 'Fresh-context, diff-only adversarial PR review — five skeptical AI lenses that fail the merge on real defects.'
author: 'James Crowley'

branding:
  icon: 'shield'
  color: 'purple'

inputs:
  mode:
    description: "'lens' to run a single review persona, or 'gate' to aggregate and adjudicate."
    required: true
  lens:
    description: "Which persona to run when mode=lens: blind | edge-case | acceptance | sentinel | viper."
    required: false
    default: ''
  lenses:
    description: "Comma-separated lens keys the gate should expect (mode=gate). Must match the caller matrix."
    required: false
    default: 'blind,edge-case,acceptance,sentinel,viper'
  api_key:
    description: "Provider API key (e.g. OpenRouter). Required for mode=lens. Pass from a secret."
    required: false
    default: ''
  github_token:
    description: "A GITHUB_TOKEN (or PAT) with pull-requests write access. Pass the workflow's GITHUB_TOKEN secret."
    required: true
  provider:
    description: "pi provider backend."
    required: false
    default: 'openrouter'
  model:
    description: "Model id for the provider."
    required: false
    default: 'z-ai/glm-5.2'
  thinking_level:
    description: "pi thinking level: low | medium | high."
    required: false
    default: 'medium'
  diff_max_lines:
    description: "Max diff lines fed to the reviewer."
    required: false
    default: '2000'
  diff_max_bytes:
    description: "Max diff bytes fed to the reviewer."
    required: false
    default: '204800'
  diff_ignore_patterns:
    description: "Space-separated globs to exclude from the diff (lockfiles, build output, vendored code)."
    required: false
    default: 'dist/ build/ node_modules/ pnpm-lock.yaml package-lock.json yarn.lock uv.lock poetry.lock go.sum Cargo.lock'
  loaded_tools:
    description: "Newline-separated allowlist of pi tools the lens agent may use. Default is READ-ONLY (fetch diff, fetch thread) — the agent does NOT post the review; it emits findings as JSON and the action posts the review deterministically via Octokit. No shell, file-write, push, or PR-write tool, so a successful prompt injection can't exfiltrate the provider key or mutate the repo. Broaden at your own risk (OWASP LLM01)."
    required: false
    default: |
      get_pr_diff
      get_issue_or_pr_thread
  pr_number:
    description: "PR number to review. Defaults to the triggering pull_request."
    required: false
    default: ''
  dismiss_superseded:
    description: "mode=lens: when true (default), once the new review lands the lens dismisses its OWN prior reviews from earlier commits and collapses their inline comments as OUTDATED, so re-runs on new pushes do not pile up stale noise. Set to false to keep every historical review. Best-effort and cosmetic; needs pull-requests write (already required to post)."
    required: false
    default: 'true'
  required_checks:
    description: "mode=preflight: comma-separated check-run names that must PASS before the review runs (e.g. lint, typecheck, docker, secret-scan). Preflight waits for them and fails if any fails, so the paid lenses never run on a PR that fails the cheap deterministic gates. List only checks that run on every PR."
    required: false
    default: ''
  preflight_timeout_seconds:
    description: "mode=preflight: max seconds to wait for required_checks to complete before failing."
    required: false
    default: '600'
  preflight_poll_seconds:
    description: "mode=preflight: seconds between polls while waiting for required_checks."
    required: false
    default: '30'
runs:
  using: 'composite'
  steps:
    # ── Shared context: resolve the effective PR number and lens display names. ──
    - id: ctx
      shell: node {0}
      env:
        IN_MODE: ${{ inputs.mode }}
        IN_LENS: ${{ inputs.lens }}
        IN_LENSES: ${{ inputs.lenses }}
        IN_PR: ${{ inputs.pr_number }}
        EVENT_PR: ${{ github.event.pull_request.number }}
        IN_KEY: ${{ inputs.api_key }}
      run: |
        const fs = require("fs");
        const append = (k, v) => fs.appendFileSync(process.env.GITHUB_OUTPUT, `${k}=${v}\n`);
        const die = (m) => { console.log(`::error::${m}`); process.exit(1); };

        const NAMES = {
          blind: "Blind Hunter",
          "edge-case": "Edge Case Hunter",
          acceptance: "Acceptance Auditor",
          sentinel: "Sentinel",
          viper: "Viper",
          compliance: "Compliance Auditor",
          "owasp-web": "OWASP Web Top 10",
          "owasp-llm": "OWASP LLM Top 10",
        };

        const pr = (process.env.IN_PR || "").trim() || (process.env.EVENT_PR || "").trim();
        if (!pr) die("No PR number (not a pull_request event and pr_number unset)");
        append("pr_number", pr);

        if (process.env.IN_MODE === "lens") {
          const key = (process.env.IN_LENS || "").trim();
          const name = NAMES[key];
          if (!name) die(`Unknown lens '${key}' (expected ${Object.keys(NAMES).join("|")})`);
          if (!(process.env.IN_KEY || "").trim()) {
            die("api_key is required for mode: lens — pass your repo's provider key (e.g. secrets.OPENROUTER_API_KEY) as 'api_key'. The action never falls back to any other key.");
          }
          append("lens_name", name);
        }

        // Gate: pipe-separated display names from the expected keys.
        const keys = (process.env.IN_LENSES || "").split(",").map((s) => s.trim()).filter(Boolean);
        const expected = keys.map((k) => NAMES[k] || die(`Unknown lens key '${k}' in lenses input`));
        append("expected", expected.join("|"));

    # ── Consumer checkout (mode=lens): reviewers read surrounding code to confirm findings. ──
    - name: Checkout PR head
      if: inputs.mode == 'lens'
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        ref: ${{ github.event.pull_request.head.sha }}
        fetch-depth: 0

    # ── Compose the lens prompt: persona + shared output contract, PR number substituted. ──
    - name: Compose lens prompt
      if: inputs.mode == 'lens'
      shell: node {0}
      env:
        ACTION_PATH: ${{ github.action_path }}
        LENS_KEY: ${{ inputs.lens }}
        PR: ${{ steps.ctx.outputs.pr_number }}
        REPO: ${{ github.repository }}
      run: |
        const fs = require("fs");
        const path = require("path");
        const die = (m) => { console.log(`::error::${m}`); process.exit(1); };

        const actionPath = process.env.ACTION_PATH;
        const lensKey = process.env.LENS_KEY;
        const personaPath = path.join(actionPath, "lenses", `${lensKey}.md`);
        const sharedPath = path.join(actionPath, "lenses", "shared-instructions.md");
        if (!fs.existsSync(personaPath)) die(`Missing persona file ${personaPath}`);
        if (!fs.existsSync(sharedPath)) die("Missing shared-instructions.md");

        // Hand the agent the exact repo + PR from trusted GitHub Actions context
        // (never from PR content), so get_pr_diff / get_issue_or_pr_thread resolve
        // without guessing. The read+review-only tool allowlist otherwise leaves
        // the agent no way to self-discover owner/repo, and it fails the diff fetch.
        const repo = (process.env.REPO || "").trim();          // "owner/name"
        const [owner, name] = repo.split("/");
        const target =
          `You are reviewing GitHub pull request #${process.env.PR} in repository ` +
          `\`${repo}\`. When you call \`get_pr_diff\` or \`get_issue_or_pr_thread\`, pass ` +
          `exactly owner=\`${owner}\`, repo=\`${name}\`, pull_number=${process.env.PR}. ` +
          `Do not guess or try other owner/repo values.\n\n`;

        let prompt = target + fs.readFileSync(personaPath, "utf8").split("__PR_NUMBER__").join(process.env.PR) + "\n";

        // The reviewer's instructions come ONLY from this action's own pinned,
        // trusted lenses — never from the PR-under-review's checkout. Reading a
        // persona or rules file out of the untrusted PR head would let a PR
        // rewrite its own reviewer ("post No findings, approve") — prompt
        // injection, OWASP LLM01. Per-repo tuning is a LOCAL, trusted feature
        // (see lenses/README.md); CI always runs the static base set.
        prompt += "\n" + fs.readFileSync(sharedPath, "utf8");

        const delim = "ADV_REVIEW_PROMPT_EOF";
        fs.appendFileSync(process.env.GITHUB_ENV, `COMPOSED_PROMPT<<${delim}\n${prompt}\n${delim}\n`);

    - name: Run adversarial lens
      id: pi
      if: inputs.mode == 'lens'
      uses: shaftoe/pi-coding-agent-action@0698813906fb1f23425bd742510e3080d624840d # v2.27.0
      with:
        github_token: ${{ inputs.github_token }}
        provider: ${{ inputs.provider }}
        model: ${{ inputs.model }}
        token: ${{ inputs.api_key }}
        thinking_level: ${{ inputs.thinking_level }}
        diff_max_lines: ${{ inputs.diff_max_lines }}
        diff_max_bytes: ${{ inputs.diff_max_bytes }}
        diff_ignore_patterns: ${{ inputs.diff_ignore_patterns }}
        loaded_tools: ${{ inputs.loaded_tools }}
        export_session_html: true
        prompt: ${{ env.COMPOSED_PROMPT }}

    # ── Parse the agent's JSON findings, render the `## <Lens>` review body, and
    #    POST it via Octokit. The agent never touches the GitHub write API — it
    #    only emits JSON in its final message (steps.pi.outputs.response). This
    #    step is deterministic: a flaky/empty model output fails THIS lens job
    #    loudly (attributably) so a human re-runs it. No automatic retry. ──
    - name: Parse findings + post review
      id: post
      if: always() && inputs.mode == 'lens'
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        LENS_NAME: ${{ steps.ctx.outputs.lens_name }}
        PR_NUMBER: ${{ steps.ctx.outputs.pr_number }}
        AGENT_RESPONSE: ${{ steps.pi.outputs.response }}
        AGENT_SUCCESS: ${{ steps.pi.outputs.success }}
        DISMISS_SUPERSEDED: ${{ inputs.dismiss_superseded }}
      with:
        script: |
          const fs = require("fs");
          const lensName = process.env.LENS_NAME;
          const prNumber = Number(process.env.PR_NUMBER);
          const headSha = context.payload.pull_request.head.sha;
          const owner = context.repo.owner;
          const repo = context.repo.repo;

          const SEVERITIES = new Set(["MUST FIX", "SHOULD FIX", "NITPICK"]);

          // ── 1. Extract the JSON object from the agent's final message. ──
          // The instructions ask for JSON only, but be tolerant: models often emit
          // a short prose preamble ("I'll fetch the diff.") before the JSON, or
          // wrap it in ```json fences. Strategy: strip fences, then walk brace
          // depth from the FIRST `{` to its MATCHING `}` (a lastIndexOf approach
          // breaks on nested objects like findings:[{...}], pointing at an inner
          // brace). Try the whole message first as the fast path.
          const raw = process.env.AGENT_RESPONSE || "";
          const fail = (m) => { core.setFailed(`Lens "${lensName}" — ${m}`); return null; };
          if (!raw.trim()) {
            return fail(`agent produced no output (steps.pi.outputs.response empty; agent_success=${process.env.AGENT_SUCCESS}). Re-run this job to retry.`);
          }
          // Strip ```json / ``` fences so a fenced block parses as the whole.
          const fenceStripped = raw.replace(/```(?:json)?/gi, "").trim();
          let parsed = null;
          try { parsed = JSON.parse(fenceStripped); } catch (_) {}
          if (!parsed) {
            // Walk from the first `{` to its matching `}`, skipping braces inside
            // string literals (so `{` inside a JSON string value doesn't fool us).
            const start = fenceStripped.indexOf("{");
            if (start !== -1) {
              let depth = 0, inStr = false, esc = false, end = -1;
              for (let i = start; i < fenceStripped.length; i++) {
                const c = fenceStripped[i];
                if (inStr) {
                  if (esc) esc = false;
                  else if (c === "\\") esc = true;
                  else if (c === '"') inStr = false;
                } else if (c === '"') inStr = true;
                else if (c === "{") depth++;
                else if (c === "}") { depth--; if (depth === 0) { end = i; break; } }
              }
              if (end > start) {
                try { parsed = JSON.parse(fenceStripped.slice(start, end + 1)); } catch (e) {
                  return fail(`agent response was not valid JSON (${e.message}). Re-run this job to retry.`);
                }
              }
            }
          }
          if (!parsed || typeof parsed !== "object") {
            return fail("agent response had no parseable JSON object. Re-run this job to retry.");
          }

          // ── 2. Validate the schema. ──
          // Lens name: accept case-insensitive match OR one containing the other,
          // so a persona that calls itself "Compliance Auditor" validates against
          // a lens keyed "compliance" (display "Compliance"). Exact match is the
          // common case; the fuzzy check is defensive against persona naming drift.
          const emittedLens = String(parsed.lens || "").trim();
          const norm = (s) => s.toLowerCase();
          const lensOk = emittedLens && (
            norm(emittedLens) === norm(lensName) ||
            norm(emittedLens).includes(norm(lensName)) ||
            norm(lensName).includes(norm(emittedLens))
          );
          if (!lensOk) {
            return fail(`agent emitted lens="${emittedLens}" but this job is "${lensName}". Re-run this job to retry.`);
          }
          const summary = typeof parsed.summary === "string" ? parsed.summary.trim() : "";
          let findings = Array.isArray(parsed.findings) ? parsed.findings : null;
          if (findings === null) return fail(`JSON missing or non-array \`findings\` (use [] for none). Re-run this job to retry.`);
          for (const f of findings) {
            if (typeof f !== "object" || !f) return fail("a finding is not an object. Re-run this job to retry.");
            if (!SEVERITIES.has(f.severity)) return fail(`finding severity "${f.severity}" not in {MUST FIX, SHOULD FIX, NITPICK}. Re-run this job to retry.`);
            if (typeof f.location !== "string" || !f.location.trim()) return fail("a finding has no \`location\` (file:line). Re-run this job to retry.");
            if (typeof f.detail !== "string" || !f.detail.trim()) return fail("a finding has no \`detail\`. Re-run this job to retry.");
            if (typeof f.recommendation !== "string" || !f.recommendation.trim()) return fail("a finding has no \`recommendation\`. Re-run this job to retry.");
          }
          core.info(`Parsed ${findings.length} finding(s) for "${lensName}".`);

          // ── 3. Render the review body: `## <Lens Name>` + summary + bullets. ──
          const lines = [`## ${lensName}`, ""];
          if (summary) lines.push(`> ${summary}`, "");
          if (findings.length === 0) {
            lines.push("No findings.");
          } else {
            for (const f of findings) {
              lines.push(`- [${f.severity}] \`${f.location}\` — ${f.detail}`);
              lines.push(`  - Fix: ${f.recommendation}`);
            }
          }
          const body = lines.join("\n");
          const event = findings.some((f) => f.severity === "MUST FIX") ? "REQUEST_CHANGES" : "COMMENT";

          // ── 4. Build the inline-comment anchor. The GitHub review API requires
          //    a non-empty comments array. Anchor one comment on the first changed
          //    file/line of the diff (deterministic — we compute it, not the
          //    model), plus per-finding comments whose location maps to a real
          //    diff line. Every path MUST come from the actual PR files; an
          //    invented path would 422 the whole review. ──
          const files = await github.paginate(github.rest.pulls.listFiles, {
            owner, repo, pull_number: prNumber, per_page: 100,
          });
          // Map of path -> Set of changed line numbers (from unified-diff hunks).
          // Only count real added lines (`+`, not the `+++ ` file header) so the
          // anchor line is always a valid new-file line number >= 1.
          const changedLinesByPath = new Map();
          for (const f of files) {
            const set = new Set();
            let line = 0;
            for (const h of (f.patch || "").split("\n")) {
              const m = h.match(/^@@ -\d+(?:,\d+)? \+(\d+)(?:,\d+)? @@/);
              if (m) { line = Number(m[1]); continue; }
              if (h.startsWith("+++") || h.startsWith("---")) continue; // file headers
              if (h.startsWith("+")) { set.add(line); line++; continue; }
              if (h.startsWith("-") || h.startsWith("\\")) continue;
              if (h.startsWith(" ")) line++;
            }
            if (set.size) changedLinesByPath.set(f.filename, set);
          }
          const parseLoc = (loc) => {
            const m = String(loc).match(/^(.+):(\d+)$/);
            return m ? { path: m[1], line: Number(m[2]) } : null;
          };
          const comments = [];
          const used = new Set();
          for (const f of findings) {
            const loc = parseLoc(f.location);
            if (!loc) continue;
            const set = changedLinesByPath.get(loc.path);
            if (!set || !set.has(loc.line)) continue; // not a real diff line — skip
            const key = `${loc.path}:${loc.line}`;
            if (used.has(key)) continue;
            used.add(key);
            comments.push({ path: loc.path, line: loc.line, body: `[${f.severity}] ${f.detail}\n\nFix: ${f.recommendation}` });
          }
          // Fallback anchor: first changed file's first changed line, body="See the review summary."
          if (!comments.length) {
            for (const [path, lines2] of changedLinesByPath) {
              const firstLine = Math.min(...lines2);
              comments.push({ path, line: firstLine, body: "See the review summary." });
              break;
            }
          }
          if (!comments.length) {
            return fail("PR has no changed files to anchor an inline comment on (empty diff?). Cannot post review.");
          }

          // ── 5. Post the review via Octokit (deterministic). ──
          core.info(`Posting review: event=${event}, ${comments.length} inline comment(s), body ${body.length} chars.`);
          let review;
          try {
            review = await github.rest.pulls.createReview({
              owner, repo, pull_number: prNumber,
              commit_id: headSha, body, event, comments,
            });
          } catch (e) {
            return fail(`createReview failed: ${e.message}`);
          }
          core.info(`Posted review id=${review.data.id} on ${headSha.slice(0, 12)}.`);

          // ── 6. Verify it landed on the head SHA (same contract as before). ──
          const reviews = await github.paginate(github.rest.pulls.listReviews, {
            owner, repo, pull_number: prNumber, per_page: 100,
          });
          const isBot = (r) => r.user && (r.user.login === "github-actions[bot]" || r.user.login === "github-actions");
          const header = `## ${lensName}`;
          const ok = reviews.some(
            (r) => r.commit_id === headSha && isBot(r) && (r.body || "").trim().startsWith(header),
          );
          core.info(`"${header}" review on ${headSha.slice(0, 12)}: ${ok}`);
          if (!ok) {
            core.setFailed(`Lens "${lensName}" posted a review but it did not land on the head SHA. Re-run this job to retry.`);
          }

          // ── 7. Reconcile: once the new review has landed, dismiss THIS lens's
          //    superseded reviews (from earlier commits) and collapse their inline
          //    comments as OUTDATED, so re-runs on new pushes don't pile up stale
          //    noise. Best-effort and cosmetic — a failure here never fails the
          //    lens, and the gate already scopes adjudication to the head SHA.
          //    Each lens only touches its OWN `## <Lens>` reviews (header match),
          //    so lenses running in parallel never collide. ──
          const dismissOn = String(process.env.DISMISS_SUPERSEDED || "true").toLowerCase() !== "false";
          if (ok && dismissOn) {
            try {
              const superseded = reviews.filter(
                (r) =>
                  isBot(r) &&
                  (r.body || "").trim().startsWith(header) &&
                  r.commit_id &&
                  r.commit_id !== headSha &&
                  r.state !== "DISMISSED" &&
                  r.id !== review.data.id,
              );
              let dismissed = 0, minimized = 0;
              if (superseded.length) {
                const supIds = new Set(superseded.map((r) => r.id));
                const allComments = await github.paginate(github.rest.pulls.listReviewComments, {
                  owner, repo, pull_number: prNumber, per_page: 100,
                });
                const byReview = new Map();
                for (const c of allComments) {
                  if (!supIds.has(c.pull_request_review_id)) continue;
                  (byReview.get(c.pull_request_review_id) || byReview.set(c.pull_request_review_id, []).get(c.pull_request_review_id)).push(c);
                }
                for (const r of superseded) {
                  // Collapse this review's inline comments FIRST, and dismiss it only
                  // if EVERY comment collapsed. Dismissing first is non-atomic: if a
                  // later minimize fails, the review is already DISMISSED and the
                  // `superseded` filter excludes it forever, stranding its remaining
                  // comments with no retry path. Minimize-first + dismiss-only-if-all
                  // makes a partial failure self-heal — the review stays
                  // CHANGES_REQUESTED and is retried on the next run.
                  let allCollapsed = true;
                  for (const c of (byReview.get(r.id) || [])) {
                    try {
                      await github.graphql(
                        "mutation($id: ID!) { minimizeComment(input: { subjectId: $id, classifier: OUTDATED }) { minimizedComment { isMinimized } } }",
                        { id: c.node_id },
                      );
                      minimized++;
                    } catch (e) {
                      allCollapsed = false; // rate limit / perms — leave un-dismissed so next run retries
                    }
                  }
                  // dismissReview applies only to CHANGES_REQUESTED / APPROVED; a
                  // COMMENTED review can't be dismissed (its comments are collapsed above).
                  if (allCollapsed && (r.state === "CHANGES_REQUESTED" || r.state === "APPROVED")) {
                    try {
                      await github.rest.pulls.dismissReview({
                        owner, repo, pull_number: prNumber, review_id: r.id,
                        message: `Superseded by the ${lensName} review on ${headSha.slice(0, 7)}.`,
                      });
                      dismissed++;
                    } catch (e) {
                      core.info(`  could not dismiss review ${r.id}: ${e.message}`);
                    }
                  }
                }
                core.info(`Reconciled ${superseded.length} superseded "${lensName}" review(s): collapsed ${minimized} comment(s), dismissed ${dismissed}.`);
              }
            } catch (e) {
              core.warning(`Reconcile step failed (non-fatal): ${e.message}`);
            }
          }

    - name: Upload review session
      if: always() && inputs.mode == 'lens' && steps.pi.outputs.session_html_path
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: pi-review-session-${{ inputs.lens }}
        path: ${{ steps.pi.outputs.session_html_path }}
        retention-days: 30

    # ── Merge gate (mode=gate): adjudicate the lenses on the head commit, fail closed. ──
    - name: Aggregate lens results
      if: inputs.mode == 'gate'
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        EXPECTED: ${{ steps.ctx.outputs.expected }}
        PR_NUMBER: ${{ steps.ctx.outputs.pr_number }}
      with:
        script: |
          const prNumber = Number(process.env.PR_NUMBER);
          const headSha = context.payload.pull_request.head.sha;
          const EXPECTED = process.env.EXPECTED.split("|").filter(Boolean);

          const reviews = await github.paginate(github.rest.pulls.listReviews, {
            owner: context.repo.owner,
            repo: context.repo.repo,
            pull_number: prNumber,
            per_page: 100,
          });

          const isBot = (r) =>
            r.user && (r.user.login === "github-actions[bot]" || r.user.login === "github-actions");
          // Match by "## <Lens>" header prefix; an empty/"null" body matches nothing.
          const lensOf = (r) => {
            const first = (r.body || "").trim().split("\n")[0].trim();
            return EXPECTED.find((l) => first.startsWith(`## ${l}`)) || null;
          };
          const onHead = reviews.filter((r) => r.commit_id === headSha && isBot(r) && EXPECTED.includes(lensOf(r)));

          // Keep only the LATEST review per lens, so a stale CHANGES_REQUESTED (or an
          // earlier empty body) from a prior attempt on the same SHA can't block a re-run.
          const latestByLens = new Map();
          for (const r of onHead) {
            const lens = lensOf(r);
            const prev = latestByLens.get(lens);
            if (!prev || new Date(r.submitted_at) > new Date(prev.submitted_at)) latestByLens.set(lens, r);
          }
          const missing = EXPECTED.filter((l) => !latestByLens.has(l));
          const blocked = [...latestByLens.values()].filter((r) => r.state === "CHANGES_REQUESTED");

          core.info(`Lenses on ${headSha.slice(0, 12)}: ${latestByLens.size} / ${EXPECTED.length} (requesting changes: ${blocked.length})`);
          for (const [lens, r] of latestByLens) core.info(`  ${r.state.padEnd(18)} ## ${lens}`);
          if (missing.length) core.info(`  MISSING: ${missing.join(", ")}`);

          if (missing.length > 0) {
            core.setFailed(
              `Missing well-formed review from: ${missing.join(", ")}. ` +
              `These lenses returned empty/malformed output — re-run their jobs to retry.`,
            );
            return;
          }
          if (blocked.length > 0) {
            const names = blocked.map((r) => (r.body || "").trim().split("\n")[0].replace(/^##\s*/, "")).join(", ");
            core.setFailed(`${blocked.length} lens(es) requested changes (${names}) — resolve MUST FIX findings before merge`);
            return;
          }
          core.info(`All ${EXPECTED.length} lenses completed with no blocking findings. Gate passes.`);

    # ── Preflight (mode=preflight): wait for the cheap deterministic checks to
    #    PASS before the paid lenses run. No model call. ──
    - name: Wait for prerequisite checks
      if: inputs.mode == 'preflight'
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        REQUIRED_CHECKS: ${{ inputs.required_checks }}
        TIMEOUT_S: ${{ inputs.preflight_timeout_seconds }}
        POLL_S: ${{ inputs.preflight_poll_seconds }}
      with:
        script: |
          const required = (process.env.REQUIRED_CHECKS || "").split(",").map((s) => s.trim()).filter(Boolean);
          if (!required.length) { core.info("No required_checks configured — preflight passes."); return; }

          const headSha = context.payload.pull_request.head.sha;
          const timeoutMs = Number(process.env.TIMEOUT_S || "1500") * 1000;
          const pollMs = Number(process.env.POLL_S || "30") * 1000;
          const start = Date.now();
          const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
          const FAIL = ["failure", "cancelled", "timed_out", "action_required", "stale"];

          while (true) {
            const runs = await github.paginate(github.rest.checks.listForRef, {
              owner: context.repo.owner, repo: context.repo.repo, ref: headSha, per_page: 100,
            });
            const stateOf = (name) => {
              const m = runs.filter((r) => r.name === name);
              if (!m.length) return "missing";
              const latest = m.sort((a, b) => new Date(b.started_at || 0) - new Date(a.started_at || 0))[0];
              return latest.status === "completed" ? (latest.conclusion || "unknown") : "pending";
            };
            const state = Object.fromEntries(required.map((n) => [n, stateOf(n)]));
            const failed = required.filter((n) => FAIL.includes(state[n]));
            if (failed.length) {
              core.setFailed(`Prerequisite check(s) failed — skipping the agentic review: ${failed.map((n) => `${n}=${state[n]}`).join(", ")}`);
              return;
            }
            const waiting = required.filter((n) => state[n] === "missing" || state[n] === "pending");
            if (!waiting.length) {
              core.info(`All prerequisite checks passed: ${required.join(", ")}.`);
              return;
            }
            if (Date.now() - start > timeoutMs) {
              core.setFailed(`Timed out after ${Math.round(timeoutMs / 1000)}s waiting for: ${waiting.join(", ")} (are these exact check names that run on every PR?)`);
              return;
            }
            core.info(`Waiting on: ${waiting.join(", ")} — elapsed ${Math.round((Date.now() - start) / 1000)}s`);
            await sleep(pollMs);
          }
