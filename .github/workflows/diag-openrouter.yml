# TEMPORARY diagnostic — reproduces the failing lens call with a fetch logger
# injected, to capture the exact URL that returns the HTML 404.
# Delete this workflow (and its PR) once the outage is root-caused.
name: Diag OpenRouter Edge

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  lens-logged:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Write fetch logger (logs method/URL/status only — never headers or bodies)
        run: |
          cat > /tmp/log-fetch.cjs <<'JS'
          const orig = globalThis.fetch;
          if (orig) {
            globalThis.fetch = async function (input, init) {
              const url = typeof input === 'string' ? input : (input && input.url) || String(input);
              const method = (init && init.method) || (input && input.method) || 'GET';
              try {
                const res = await orig.call(this, input, init);
                console.error(`[fetch-log] ${method} ${url} -> ${res.status} ${res.headers.get('content-type')}`);
                return res;
              } catch (e) {
                console.error(`[fetch-log] ${method} ${url} -> THREW ${e && e.message}`);
                throw e;
              }
            };
          }
          JS
          echo written

      - name: Real lens call with fetch logging (expected to fail; that is the point)
        id: lens
        continue-on-error: true
        env:
          NODE_OPTIONS: --require /tmp/log-fetch.cjs
        uses: ./
        with:
          mode: lens
          lens: blind
          github_token: ${{ secrets.GITHUB_TOKEN }}
          api_key: ${{ secrets.OPENROUTER_API_KEY }}
          model: anthropic/claude-sonnet-5

      - name: Direct dist invocation with logger (fallback if NODE_OPTIONS was stripped above)
        if: always()
        env:
          INPUT_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_TOKEN: ${{ secrets.OPENROUTER_API_KEY }}
          INPUT_PROVIDER: openrouter
          INPUT_MODEL: anthropic/claude-sonnet-5
          INPUT_THINKING_LEVEL: medium
          INPUT_PROMPT: "Reply with exactly: OK"
        run: |
          DIST=$(find /home/runner/work/_actions/shaftoe/pi-coding-agent-action -name index.js -path '*dist*' | head -1)
          echo "dist: $DIST"
          node --require /tmp/log-fetch.cjs "$DIST" 2>&1 | grep -aE '\[fetch-log\]|OK|error|Error|404' | grep -v 'api\.github\.com' | head -30 || true
