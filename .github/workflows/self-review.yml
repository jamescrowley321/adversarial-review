# Dogfood: Adversarial Review reviews its own pull requests using the action in
# this repo (uses: ./). Toggle lenses in the `config` job's ENABLED list.
# owasp-llm is enabled here on purpose — this action is itself an LLM app.

name: Self Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]

# cancel-in-progress kills a *running* review when a new commit lands — but it
# does NOT cancel a run parked in the environment-approval `waiting` state, so
# those pile up and collide (observed: a stale waiting run cancelled a live one
# ~57s in). The `cancel-stale` job below closes that gap explicitly.
concurrency:
  group: self-review-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  # Kill any older run of this workflow on this branch — including ones stuck in
  # the approval `waiting` state that cancel-in-progress leaves behind — so a new
  # push always supersedes the previous review cleanly. Runs in parallel; the
  # current run proceeds while stale ones are cancelled.
  cancel-stale:
    name: Cancel superseded runs
    runs-on: ubuntu-latest
    if: >-
      github.event.pull_request.head.repo.fork == false &&
      github.actor != 'dependabot[bot]'
    permissions:
      actions: write
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { owner, repo } = context.repo;
            const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
              owner, repo,
              workflow_id: "self-review.yml",
              branch: context.payload.pull_request.head.ref,
              per_page: 100,
            });
            const ACTIVE = new Set(["queued", "in_progress", "waiting", "pending", "requested", "action_required"]);
            let n = 0;
            for (const r of runs) {
              if (r.id === context.runId) continue;
              // Only supersede OLDER runs, so two near-simultaneous runs don't cancel each other.
              if (r.run_number >= context.runNumber) continue;
              if (!ACTIVE.has(r.status)) continue;
              try {
                await github.rest.actions.cancelWorkflowRun({ owner, repo, run_id: r.id });
                core.info(`Cancelled superseded run #${r.run_number} (${r.id}, was ${r.status}).`);
                n++;
              } catch (e) {
                core.info(`Could not cancel run ${r.id}: ${e.message}`);
              }
            }
            core.info(`Superseded ${n} older run(s).`);

  config:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
      csv: ${{ steps.pick.outputs.csv }}
    steps:
      - id: pick
        shell: node {0}
        env:
          ENABLED: |
            blind
            edge-case
            acceptance
            sentinel
            viper
            compliance
            owasp-web
            owasp-llm
        run: |
          const NAMES = {
            blind: "Blind Hunter", "edge-case": "Edge Case Hunter",
            acceptance: "Acceptance Auditor", sentinel: "Sentinel", viper: "Viper",
            compliance: "Compliance Auditor", "owasp-web": "OWASP Web Top 10",
            "owasp-llm": "OWASP LLM Top 10",
          };
          const keys = (process.env.ENABLED || "").split("\n")
            .map((l) => l.replace(/#.*/, "").trim()).filter(Boolean);
          const include = keys.map((k) => ({ lens: k, name: NAMES[k] || k }));
          const fs = require("fs");
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `matrix=${JSON.stringify({ include })}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `csv=${keys.join(",")}\n`);

  # Spend gate: ONE approval checkpoint that carries the `llm-review` environment
  # (required reviewer). The paid review jobs `needs:` it, so OPENROUTER_API_KEY
  # isn't spent until a maintainer approves the run — a single approval per run,
  # even though lenses run as a capped-parallel matrix (putting `environment:` on
  # the matrix itself prompts once per max-parallel wave). Because `uses: ./` runs
  # the PR's checked-out code with the key injected, a same-repo PR is otherwise a
  # spend/exfil path; this gate closes it. For untrusted collaborators, also scope
  # OPENROUTER_API_KEY to the environment so a workflow edit that drops this gate
  # still can't read the key.
  approve:
    name: Approve LLM spend
    needs: config
    runs-on: ubuntu-latest
    environment: llm-review
    if: >-
      github.event.pull_request.head.repo.fork == false &&
      github.actor != 'dependabot[bot]'
    steps:
      - run: echo "Approved — lenses may spend the provider key."

  review:
    name: ${{ matrix.name }}
    needs: [config, approve]
    runs-on: ubuntu-latest
    # Lenses run in PARALLEL (one job per lens). The agent never posts the review
    # itself — it emits findings as JSON and the action posts via Octokit
    # deterministically — so concurrent-load tool-call flakes are no longer a risk.
    timeout-minutes: 10
    if: >-
      github.event.pull_request.head.repo.fork == false &&
      github.actor != 'dependabot[bot]'
    strategy:
      fail-fast: false
      # Full parallel: all lenses run in one wave so the whole review lands well
      # under 10 min end-to-end. The earlier max-parallel:2 cap was for OpenRouter
      # 429s seen with 8 concurrent *Opus* calls; Sonnet 5 (below) has more rate
      # headroom, so the cap is no longer needed. If a lower-tier key starts
      # 429ing, re-add `max-parallel: 4`.
      matrix: ${{ fromJSON(needs.config.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: ${{ matrix.name }}
        uses: ./
        with:
          mode: lens
          lens: ${{ matrix.lens }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          api_key: ${{ secrets.OPENROUTER_API_KEY }}
          # Sonnet 5: strong JSON adherence (GLM-5.2 emitted prose on ~6/8 lenses;
          # that's why we left it), near-Opus finding quality, and enough rate
          # headroom to run all lenses in one wave — keeps the review under 10 min.
          model: anthropic/claude-sonnet-5

  gate:
    name: Merge Gate
    needs: [config, review]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always() && needs.review.result != 'skipped'
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Adjudicate lenses
        uses: ./
        with:
          mode: gate
          lenses: ${{ needs.config.outputs.csv }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
