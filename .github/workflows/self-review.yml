# Dogfood: Blind Peer Review reviews its own pull requests using the action in
# this repo (uses: ./). Toggle lenses in the `config` job's ENABLED list.
# owasp_llm is enabled here on purpose — this action is itself an LLM app.

name: Self Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]

# A new push cancels the in-progress review for this branch. cancel-in-progress
# covers the common case; the `cancel-stale` job below is a belt-and-suspenders
# sweep for any older run left active (a queued/pending run the concurrency group
# can race past).
concurrency:
  group: self-review-${{ github.ref }}
  cancel-in-progress: true

# Write scopes live on the jobs that use them (`review` below); everything else
# runs read-only.
permissions:
  contents: read

jobs:
  # Belt-and-suspenders: explicitly cancel any older run of this workflow still
  # active on this branch, so a new push always supersedes the previous review
  # cleanly even if the concurrency group races past a queued/pending run. Runs
  # in parallel; the current run proceeds while stale ones are cancelled.
  cancel-stale:
    name: Cancel superseded runs
    runs-on: ubuntu-latest
    if: >-
      github.event.pull_request.head.repo.fork == false &&
      github.actor != 'dependabot[bot]'
    permissions:
      actions: write
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { owner, repo } = context.repo;
            const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
              owner, repo,
              workflow_id: "self-review.yml",
              branch: context.payload.pull_request.head.ref,
              per_page: 100,
            });
            const ACTIVE = new Set(["queued", "in_progress", "waiting", "pending", "requested", "action_required"]);
            let n = 0;
            for (const r of runs) {
              if (r.id === context.runId) continue;
              // Only supersede OLDER runs, so two near-simultaneous runs don't cancel each other.
              if (r.run_number >= context.runNumber) continue;
              if (!ACTIVE.has(r.status)) continue;
              try {
                await github.rest.actions.cancelWorkflowRun({ owner, repo, run_id: r.id });
                core.info(`Cancelled superseded run #${r.run_number} (${r.id}, was ${r.status}).`);
                n++;
              } catch (e) {
                core.info(`Could not cancel run ${r.id}: ${e.message}`);
              }
            }
            core.info(`Superseded ${n} older run(s).`);

  config:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
      csv: ${{ steps.pick.outputs.csv }}
    steps:
      - id: pick
        shell: node {0}
        env:
          ENABLED: |
            cold_read
            edge_case
            acceptance
            security
            red_team
            policy
            owasp_web
            owasp_llm
        run: |
          const NAMES = {
            "cold_read": "Cold Read", "edge_case": "Edge Cases",
            acceptance: "Acceptance Criteria", security: "Security Review", "red_team": "Red Team",
            policy: "Policy & Provenance", "owasp_web": "OWASP Web Top 10",
            "owasp_llm": "OWASP LLM Top 10",
          };
          const keys = (process.env.ENABLED || "").split("\n")
            .map((l) => l.replace(/#.*/, "").trim()).filter(Boolean);
          if (keys.length === 0) throw new Error("At least one review lens must be enabled");
          const unknown = keys.filter((k) => !Object.prototype.hasOwnProperty.call(NAMES, k));
          if (unknown.length > 0) throw new Error(`Unknown review lenses: ${unknown.join(", ")}`);
          const include = keys.map((k) => ({ lens: k, name: NAMES[k] }));
          const fs = require("fs");
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `matrix=${JSON.stringify({ include })}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `csv=${keys.join(",")}\n`);

  # Spend controls (no approval gate — an approval environment can't stop the
  # same-repo threat it appears to, because `on: pull_request` runs the workflow
  # as edited by the PR's own commits; see SECURITY.md). Spend is bounded instead
  # by: a budget-capped OpenRouter key, fork PRs getting no secret (+ the
  # fork/dependabot `if:` guards below), the diff caps, `timeout-minutes`, and
  # `concurrency: cancel-in-progress` + the `cancel-stale` job.
  review:
    name: ${{ matrix.name }}
    needs: config
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # post findings as PR review comments
      checks: write # publish the per-lens check run
    # Lenses run in PARALLEL (one job per lens). The agent never posts the review
    # itself — it emits findings as JSON and the action posts via Octokit
    # deterministically — so concurrent-load tool-call flakes are no longer a risk.
    timeout-minutes: 10
    if: >-
      github.event.pull_request.head.repo.fork == false &&
      github.actor != 'dependabot[bot]'
    strategy:
      fail-fast: false
      # Full parallel: all lenses run in one wave so the whole review lands well
      # under 10 min end-to-end. The earlier max-parallel:2 cap was for OpenRouter
      # 429s seen with 8 concurrent *Opus* calls; Sonnet 5 (below) has more rate
      # headroom, so the cap is no longer needed. If a lower-tier key starts
      # 429ing, re-add `max-parallel: 4`.
      matrix: ${{ fromJSON(needs.config.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: ${{ matrix.name }}
        uses: ./
        with:
          mode: lens
          lens: ${{ matrix.lens }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          api_key: ${{ secrets.OPENROUTER_API_KEY }}
          # Gemini 2.5 Pro: strong JSON adherence (GLM-5.2 emitted prose on ~6/8
          # lenses), stable OpenRouter slug, and enough rate headroom to run all
          # lenses in one wave. Sonnet 5 is unusable via openrouter+pi right now:
          # OpenRouter retired the undated anthropic/claude-sonnet-5 alias while
          # pi's catalog lacks the dated snapshot, so neither slug resolves.
          model: google/gemini-2.5-pro
          # Exclude the eval fixture corpus from the reviewed diff. Those files
          # are DATA, not code: frozen `diff.patch` snippets fed to a model as
          # text, never imported, executed, or shipped. They contain planted
          # defects on purpose — a deleted auth guard, a hardcoded credential —
          # because a suite of only clean fixtures scores a lens that never
          # blocks anything as perfect.
          #
          # Reviewing them produces guaranteed false positives on every push:
          # Cold Read and the Policy & Provenance have each blocked on the
          # planted credential and the removed guard, and on #29 the OWASP LLM
          # lens reported a fixture's `src/api/reports.ts` as a real deleted
          # authorization check. A 2431-line fixture there also truncated the
          # diff, degrading review of the actual code.
          #
          # This is what diff_ignore_patterns is for (its default already skips
          # lockfiles and build output). The fixtures are not unreviewed: the
          # `Evals` workflow runs validate-fixtures.mjs on every PR, and the
          # contract tests exercise them deterministically.
          #
          # The default list is repeated because setting this input replaces it.
          diff_ignore_patterns: >-
            dist/ build/ node_modules/ pnpm-lock.yaml package-lock.json
            yarn.lock uv.lock poetry.lock go.sum Cargo.lock evals/fixtures/

  # Self-review intentionally has no preflight job: deterministic lint/security
  # checks run independently, while this gate covers only config + lens review.
  gate:
    name: Merge Gate
    needs: [config, review]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Record exempt PR
        if: github.event.pull_request.head.repo.fork == true || github.actor == 'dependabot[bot]'
        run: echo "Adversarial review is intentionally exempt for fork and Dependabot PRs."
      - name: Fail closed when prerequisites did not succeed
        if: >-
          github.event.pull_request.head.repo.fork == false &&
          github.actor != 'dependabot[bot]' &&
          (needs.config.result != 'success' || needs.review.result != 'success')
        env:
          CONFIG_RESULT: ${{ needs.config.result }}
          REVIEW_RESULT: ${{ needs.review.result }}
        run: |
          echo "::error::Adversarial review prerequisites did not succeed (config=$CONFIG_RESULT, review=$REVIEW_RESULT)."
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: >-
          github.event.pull_request.head.repo.fork == false &&
          github.actor != 'dependabot[bot]' &&
          needs.config.result == 'success' && needs.review.result == 'success'
      - name: Adjudicate lenses
        if: >-
          github.event.pull_request.head.repo.fork == false &&
          github.actor != 'dependabot[bot]' &&
          needs.config.result == 'success' && needs.review.result == 'success'
        uses: ./
        with:
          mode: gate
          lenses: ${{ needs.config.outputs.csv }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
