# Dogfood: Adversarial Review reviews its own pull requests using the action in
# this repo (uses: ./). Toggle lenses in the `config` job's ENABLED list.
# owasp-llm is enabled here on purpose — this action is itself an LLM app.

name: Self Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]

concurrency:
  group: self-review-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  config:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
      csv: ${{ steps.pick.outputs.csv }}
    steps:
      - id: pick
        shell: node {0}
        env:
          ENABLED: |
            blind
            edge-case
            acceptance
            sentinel
            viper
            compliance
            owasp-web
            owasp-llm
        run: |
          const NAMES = {
            blind: "Blind Hunter", "edge-case": "Edge Case Hunter",
            acceptance: "Acceptance Auditor", sentinel: "Sentinel", viper: "Viper",
            compliance: "Compliance Auditor", "owasp-web": "OWASP Web Top 10",
            "owasp-llm": "OWASP LLM Top 10",
          };
          const keys = (process.env.ENABLED || "").split("\n")
            .map((l) => l.replace(/#.*/, "").trim()).filter(Boolean);
          const include = keys.map((k) => ({ lens: k, name: NAMES[k] || k }));
          const fs = require("fs");
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `matrix=${JSON.stringify({ include })}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `csv=${keys.join(",")}\n`);

  review:
    name: ${{ matrix.name }}
    needs: config
    runs-on: ubuntu-latest
    # Spend gate: this is the only job that uses OPENROUTER_API_KEY. It runs in the
    # `llm-review` environment, which has a required reviewer — so the paid lenses
    # (and the key) don't unlock until a maintainer approves the run. Because
    # `uses: ./` executes the PR's checked-out action code with the key injected, a
    # same-repo PR is otherwise a spend/exfil path; the approval gate closes it.
    environment: llm-review
    # Lenses run in PARALLEL (one job per lens). The agent never posts the review
    # itself — it emits findings as JSON and the action posts via Octokit
    # deterministically — so concurrent-load tool-call flakes are no longer a risk.
    timeout-minutes: 10
    if: >-
      github.event.pull_request.head.repo.fork == false &&
      github.actor != 'dependabot[bot]'
    strategy:
      fail-fast: false
      # Cap concurrency at 2 to avoid OpenRouter 429s (8 parallel Opus calls
      # rate-limited on the test run). Lenses post deterministically now, so
      # parallelism is safe; this just eases provider pressure. Drop to unset
      # (full parallel) if your provider/key tolerates it.
      max-parallel: 2
      matrix: ${{ fromJSON(needs.config.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: ${{ matrix.name }}
        uses: ./
        with:
          mode: lens
          lens: ${{ matrix.lens }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          api_key: ${{ secrets.OPENROUTER_API_KEY }}
          # TESTING JSON-adherence with a stronger instruction-following model.
          # GLM-5.2 emitted prose instead of JSON on ~6/8 lenses per run.
          model: anthropic/claude-opus-5

  gate:
    name: Merge Gate
    needs: [config, review]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always() && needs.review.result != 'skipped'
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Adjudicate lenses
        uses: ./
        with:
          mode: gate
          lenses: ${{ needs.config.outputs.csv }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
