# Dogfood: Adversarial Review reviews its own pull requests using the action in
# this repo (uses: ./). Proves the action wires up end-to-end on every PR.

name: Self Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]

concurrency:
  group: self-review-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  review:
    name: ${{ matrix.lens-name }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: >-
      github.event.pull_request.head.repo.fork == false &&
      github.actor != 'dependabot[bot]'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { lens: blind,      lens-name: Blind Hunter }
          - { lens: edge-case,  lens-name: Edge Case Hunter }
          - { lens: acceptance, lens-name: Acceptance Auditor }
          - { lens: sentinel,   lens-name: Sentinel }
          - { lens: viper,      lens-name: Viper }
          - { lens: compliance, lens-name: Compliance }
    steps:
      - uses: actions/checkout@v7
      - name: ${{ matrix.lens-name }}
        uses: ./
        with:
          mode: lens
          lens: ${{ matrix.lens }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          api_key: ${{ secrets.OPENROUTER_API_KEY }}

  gate:
    name: Merge Gate
    runs-on: ubuntu-latest
    needs: [review]
    if: always() && needs.review.result != 'skipped'
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
      - name: Adjudicate lenses
        uses: ./
        with:
          mode: gate
          lenses: blind,edge-case,acceptance,sentinel,viper,compliance
          github_token: ${{ secrets.GITHUB_TOKEN }}
