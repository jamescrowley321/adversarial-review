name: OSV-Scanner

# Uses the OSV-Scanner reusable workflows to check dependencies (here: the
# GitHub Actions this repo pins) against the OSV vulnerability database. NOTE:
# Google deprecated the original google/osv-scanner reusable workflows; the
# maintained replacements live in google/osv-scanner-action at the same paths,
# pinned here (v2.3.8). Actions pinned to SHA; Dependabot bumps them.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "41 7 * * 1" # weekly Mon 07:41 UTC

permissions: {}

jobs:
  # PR diff scan: gates only vulns NEWLY introduced by the PR.
  scan-pr:
    if: ${{ github.event_name == 'pull_request' }}
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable-pr.yml@6e4298ebc4db23e847df9b2e2de2939d6f066c67 # v2.5.1
    permissions:
      security-events: write
      contents: read
      actions: read

  # Full scan on push/schedule: uploads SARIF to the Security tab for visibility.
  scan-scheduled:
    if: ${{ github.event_name != 'pull_request' }}
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@6e4298ebc4db23e847df9b2e2de2939d6f066c67 # v2.5.1
    permissions:
      security-events: write
      contents: read
      actions: read
    with:
      fail-on-vuln: false
