# Static checks for the action itself — Node only, no shell scripts.

name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Check action layout and cross-references
        shell: node {0}
        run: |
          const fs = require("fs");
          const LENSES = ["blind", "edge-case", "acceptance", "sentinel", "viper", "compliance", "owasp-web", "owasp-llm"];
          const required = [
            "action.yml",
            "lenses/shared-instructions.md",
            ...LENSES.map((l) => `lenses/${l}.md`),
            "examples/caller-workflow.yml",
            "scripts/run-local.mjs",
            "scripts/models-config.mjs",
            "scripts/models-config.test.mjs",
            "scripts/check-example.mjs",
          ];
          const missing = required.filter((f) => !fs.existsSync(f));
          if (missing.length) {
            console.log(`::error::missing files: ${missing.join(", ")}`);
            process.exit(1);
          }

          // action.yml must map every lens key we ship a persona for.
          const action = fs.readFileSync("action.yml", "utf8");
          const unmapped = LENSES.filter((l) => !action.includes(`${l}:`) && !action.includes(`"${l}":`));
          if (unmapped.length) {
            console.log(`::error::action.yml has no name mapping for: ${unmapped.join(", ")}`);
            process.exit(1);
          }

          // A templated expression in an input DESCRIPTION is evaluated at action-load time;
          // referencing `secrets` there makes composite actions fail to load
          // ("Unrecognized named-value: 'secrets'"). Ban templates in descriptions.
          const badDesc = action.split("\n").filter((l) => /^\s*description:/.test(l) && /\$\{\{/.test(l));
          if (badDesc.length) {
            console.log(`::error::action.yml input description contains a \$\{\{ \}\} expression (breaks action loading):\n${badDesc.join("\n")}`);
            process.exit(1);
          }
          console.log(`Layout OK: ${LENSES.length} lenses, all referenced; no templated descriptions.`);

      - name: Syntax-check the Node runner
        run: node --check scripts/run-local.mjs

      - name: Syntax-check the models-config module
        run: node --check scripts/models-config.mjs

      - name: Unit-test models-config validation (allowlist, types, clean-state)
        run: node --test scripts/models-config.test.mjs

      - name: Validate the example workflow's models_config against the allowlist
        run: node scripts/check-example.mjs

      - name: Validate the example workflow parses as YAML
        run: npx --yes js-yaml@4 examples/caller-workflow.yml > /dev/null
