# Static checks for the action itself — Node only, no shell scripts.

name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Check action layout and cross-references
        shell: node {0}
        run: |
          const fs = require("fs");
          // The registry is the one list. Hardcoding it here is how the layout
          // check goes stale against the manifest it is meant to be checking.
          const LENSES = JSON.parse(fs.readFileSync("lenses/manifest.json", "utf8")).lenses.map((l) => l.key);
          const required = [
            "action.yml",
            "lenses/shared_instructions.md",
            ...LENSES.map((l) => `lenses/${l}.md`),
            "examples/caller-workflow.yml",
            "scripts/run-local.mjs",
            "scripts/models-config.mjs",
            "scripts/models-config.test.mjs",
            "scripts/check-example.mjs",
          ];
          const missing = required.filter((f) => !fs.existsSync(f));
          if (missing.length) {
            console.log(`::error::missing files: ${missing.join(", ")}`);
            process.exit(1);
          }

          // The inverse of the old check: action.yml must NOT map lens names. It
          // reads lenses/manifest.json now, and a second copy of the list is worse
          // than none — the registry sat wrong ("Compliance" for the policy lens)
          // through a whole release because nothing read it.
          const action = fs.readFileSync("action.yml", "utf8");
          if (/const NAMES = \{/.test(action)) {
            console.log("::error::action.yml has grown a lens table again — it must read lenses/manifest.json");
            process.exit(1);
          }
          const missingPersona = LENSES.filter((l) => !fs.existsSync(`lenses/${l}.md`));
          if (missingPersona.length) {
            console.log(`::error::registry declares lenses with no persona file: ${missingPersona.join(", ")}`);
            process.exit(1);
          }

          // A templated expression in an input DESCRIPTION is evaluated at action-load time;
          // referencing `secrets` there makes composite actions fail to load
          // ("Unrecognized named-value: 'secrets'"). Ban templates in descriptions.
          const badDesc = action.split("\n").filter((l) => /^\s*description:/.test(l) && /\$\{\{/.test(l));
          if (badDesc.length) {
            console.log(`::error::action.yml input description contains a \$\{\{ \}\} expression (breaks action loading):\n${badDesc.join("\n")}`);
            process.exit(1);
          }
          console.log(`Layout OK: ${LENSES.length} lenses from the registry, each with a persona; no lens table in action.yml; no templated descriptions.`);

      - name: Syntax-check the Node runner
        run: node --check scripts/run-local.mjs

      - name: Syntax-check the models-config module
        run: node --check scripts/models-config.mjs

      - name: Syntax-check the vendor script
        run: node --check scripts/vendor.mjs

      - name: The vendored set must carry the neutral contract, not the CI one
        shell: node {0}
        run: |
          // A local harness has no submit_findings and no get_pr_diff. Vendoring
          // shared_instructions.md to one is how "ignore that CI wording" gets
          // back into the prompts.
          const { execFileSync } = require("child_process");
          const fs = require("fs");
          const os = require("os");
          const path = require("path");
          const tmp = fs.mkdtempSync(path.join(os.tmpdir(), "vendor-"));
          execFileSync("node", ["scripts/vendor.mjs", "--into", tmp]);
          const dir = path.join(tmp, ".blind-peer-review", "vendor");
          const lenses = fs.readdirSync(path.join(dir, "lenses"));
          if (lenses.includes("shared_instructions.md")) {
            console.log("::error::vendor shipped the CI-side contract to a local harness");
            process.exit(1);
          }
          for (const need of ["SOURCE.md", "shared_review_contract.md"]) {
            if (!fs.existsSync(path.join(dir, need))) {
              console.log(`::error::vendor did not write ${need}`);
              process.exit(1);
            }
          }
          console.log(`Vendor OK: ${lenses.length - 1} personas + manifest + neutral contract.`);

      - name: Unit-test models-config validation (allowlist, types, clean-state)
        run: node --test scripts/models-config.test.mjs

      - name: Validate the example workflow's models_config against the allowlist
        run: node scripts/check-example.mjs

      - name: Validate the example workflow parses as YAML
        run: npx --yes js-yaml@4 examples/caller-workflow.yml > /dev/null

      # `secrets` is not among the contexts available to an `if:`. Using it
      # there does not skip the step — the whole workflow FAILS TO PARSE, so
      # one bad condition takes the entire file offline. That shipped once:
      # release-please.yml stopped running the moment it merged, and nothing
      # caught it because a workflow's expressions are only parsed when it is
      # dispatched, which never happens on a pull request.
      - name: No `secrets` in a workflow `if:`
        shell: node {0}
        run: |
          const fs = require("fs");
          const dir = ".github/workflows";
          const bad = [];

          // Reads the WHOLE value of an `if:`, not just its first line. A
          // condition may be a block scalar spanning several lines, and a
          // first-line-only check is bypassed by exactly that — which is how
          // this guard shipped incomplete the first time.
          const conditions = (txt) => {
            const lines = txt.split("\n");
            const out = [];
            for (let i = 0; i < lines.length; i++) {
              const m = lines[i].match(/^(\s*)if:(.*)$/);
              if (!m) continue;
              const indent = m[1].length;
              let value = m[2];
              // Continuation = any following line indented deeper than the key.
              for (let j = i + 1; j < lines.length; j++) {
                if (lines[j].trim() === "") continue;
                if (lines[j].match(/^(\s*)/)[1].length <= indent) break;
                value += "\n" + lines[j];
              }
              out.push({ line: i + 1, value });
            }
            return out;
          };

          for (const f of fs.readdirSync(dir).filter((n) => /\.ya?ml$/.test(n))) {
            for (const c of conditions(fs.readFileSync(`${dir}/${f}`, "utf8"))) {
              // Conditions only: `env:` and `with:` may reference secrets freely.
              // Both access forms: `secrets.NAME` and `secrets['NAME']`.
              if (/\bsecrets\s*[.[]/.test(c.value)) bad.push(`${f}:${c.line}: ${c.value.trim().split("\n")[0]}`);
            }
          }

          if (bad.length) {
            console.log(`::error::the \`secrets\` context is not available in \`if:\` — these conditions make the whole workflow fail to parse:\n${bad.join("\n")}\n` +
              `Lift the secret into a step that emits a boolean, and test that instead.`);
            process.exit(1);
          }
          console.log("OK: no workflow condition references `secrets`.");

  # The version bump is derived from commit messages, so a mistyped type is a
  # mis-versioned release. That was survivable while a human merged every
  # release PR by hand; once releases merge themselves, nothing else is looking.
  # v1.7.2 shipped a brand-new input as a PATCH because every commit said `fix:`.
  commits:
    name: Conventional Commits
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Every commit in this PR declares a release type
        shell: node {0}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          const { execFileSync } = require("child_process");

          // release-please's Angular preset. `feat` -> minor, `fix` -> patch,
          // a `!` or a BREAKING CHANGE footer -> major; the rest do not release.
          const TYPES = ["build", "chore", "ci", "docs", "feat", "fix", "perf", "refactor", "revert", "style", "test"];
          const SUBJECT = new RegExp(`^(${TYPES.join("|")})(\\([^)]+\\))?!?: .+`);

          const base = process.env.BASE_SHA, head = process.env.HEAD_SHA;
          const raw = execFileSync("git", ["log", "--format=%H%x1f%P%x1f%s", `${base}..${head}`], { encoding: "utf8" });
          const commits = raw.split("\n").filter(Boolean).map((l) => {
            const [sha, parents, subject] = l.split("\x1f");
            return { sha, merge: parents.trim().split(/\s+/).length > 1, subject };
          });

          if (!commits.length) {
            console.log("No commits in range — nothing to check.");
            process.exit(0);
          }

          // Merge commits are authored by GitHub, not by us, and their subjects
          // ("Merge branch 'main' into ...") are not ours to shape.
          const bad = commits.filter((c) => !c.merge && !SUBJECT.test(c.subject));
          for (const c of bad) {
            console.log(`::error::${c.sha.slice(0, 8)} "${c.subject}" is not a Conventional Commit. ` +
              `Expected "<type>(<scope>)?: <subject>" where type is one of: ${TYPES.join(", ")}.`);
          }
          if (bad.length) {
            console.log(`::error::${bad.length} of ${commits.length} commit(s) would land on main without a release type, ` +
              `so release-please cannot derive the right version bump from them.`);
            process.exit(1);
          }
          console.log(`OK: ${commits.filter((c) => !c.merge).length} commit(s) checked, all conventional.`);
