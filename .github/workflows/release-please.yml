# Automated release authoring.
#
# On every push to main, release-please reads the Conventional Commits since the
# last release and maintains a "release PR" that bumps the version (SemVer) and
# updates CHANGELOG.md. Merging that release PR publishes the vX.Y.Z GitHub
# Release — no more hand-run `gh release create` from a maintainer's machine.
#
# Token-chaining, part one — the major tag:
#   A Release published with the default GITHUB_TOKEN does NOT emit a
#   `release: published` event that can trigger a *separate* workflow — GitHub
#   suppresses workflow-triggering-workflow for the default token. So we must NOT
#   rely on an `on: release` workflow to move the `vX` major tag, or `@v1` would
#   silently stop advancing. Instead, this same run — right after release-please
#   publishes, still on the push trigger and still holding contents:write —
#   advances the major tag itself. This replaces the old release.yml (its Octokit
#   logic is folded in below).
#
# Token-chaining, part two — the release PR:
#   The same suppression bites the release PR. A pull request OPENED with
#   GITHUB_TOKEN triggers no workflows, so none of branch protection's required
#   contexts (lint, both CodeQL analyses, Semgrep, Gitleaks) can ever run on it,
#   and the PR sits BLOCKED forever with zero checks. v1.7.2 was merged with
#   `gh pr merge --admin` for exactly this reason; #38 was stuck the same way.
#   A GitHub App token is the documented fix: PRs authored by an app DO trigger
#   workflows, so the release PR gets real CI and can merge on green like any
#   other change.
#
#   Any non-GITHUB_TOKEN identity works. Two supported, in priority order:
#     1. secrets.RELEASE_TOKEN — a PAT (fine-grained: Contents R/W, Pull
#        requests R/W, this repo only). Simplest; one secret.
#     2. vars.RELEASE_APP_ID + secrets.RELEASE_APP_PRIVATE_KEY — a GitHub App.
#        More setup, better hygiene: not tied to a person, cannot outlive the
#        install, and the token it mints expires in an hour.
#   Neither configured: falls back to GITHUB_TOKEN and behaves exactly as
#   before — release PRs still need an admin merge, but nothing breaks.
#   See docs/releases.md.
#
# Scope, deliberately: this workflow runs ONLY on push-to-main and manual
# dispatch. It never runs on a `pull_request` event, so no fork or outside
# contributor can reach the App token, and the repo-wide
# "require approval for all external contributors" setting is untouched.

name: Release Please

on:
  push:
    branches: [main]
  workflow_dispatch:

# Write scopes are granted on the release-please job itself, not workflow-wide.
permissions: {}

concurrency:
  # Serialize releases; never cancel one mid-publish.
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write # release commits, tags, GitHub Releases, and moving the major tag
      pull-requests: write # open / update the release PR
    steps:
      # The `secrets` context is NOT available in a step-level `if:` — a
      # workflow using it there fails to PARSE, taking the whole file down
      # rather than skipping a step. So the conditions below test a boolean
      # instead of the secret.
      #
      # Deliberately NOT a job-level `env:`. That would parse, but it puts the
      # token in the environment of EVERY step in this job, including two
      # third-party actions that have no business seeing it. This step is the
      # only one that reads the secret without needing it, and all it emits is
      # "true" or "false"; the token itself still reaches only the two steps
      # that actually use it, through `with:` and a step-scoped `env:`.
      - name: Detect a configured release identity
        id: cfg
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${RELEASE_TOKEN:-}" ]; then
            echo "have_pat=true" >> "$GITHUB_OUTPUT"
          else
            echo "have_pat=false" >> "$GITHUB_OUTPUT"
          fi

      # Short-lived (1 hour), repo-scoped, minimum permissions: Contents R/W to
      # push the release branch and publish the Release, Pull requests R/W to
      # open and update the release PR. Nothing else. Skipped entirely when the
      # variable is unset, which is what makes this a safe no-op before setup.
      - name: Mint a release token
        id: apptoken
        if: ${{ steps.cfg.outputs.have_pat == 'false' && vars.RELEASE_APP_ID != '' }}
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          # App token when configured, so the release PR gets CI; otherwise the
          # default token and the old admin-merge behaviour.
          token: ${{ secrets.RELEASE_TOKEN || steps.apptoken.outputs.token || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # With real checks running, the release PR can merge itself when they pass.
      # This is the step that makes releases actually hands-off; delete it if you
      # would rather eyeball every version bump. Auto-merge waits for branch
      # protection, so a red check still stops the release.
      #
      # Gated on a real identity being configured: enabling auto-merge under
      # GITHUB_TOKEN would arm a PR whose required checks can never run, which
      # is a trap rather than an automation.
      - name: Let the release PR merge itself once CI is green
        if: ${{ (steps.cfg.outputs.have_pat == 'true' || steps.apptoken.outputs.token != '') && steps.release.outputs.pr != '' }}
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || steps.apptoken.outputs.token }}
          PR_JSON: ${{ steps.release.outputs.pr }}
        run: |
          set -euo pipefail
          num=$(printf '%s' "$PR_JSON" | jq -r '.number // empty')
          if [ -z "$num" ]; then
            echo "release-please reported no release PR; nothing to arm."
            exit 0
          fi
          # Already-enabled is not a failure, and neither is a PR that became
          # mergeable and landed between these two steps.
          gh pr merge "$num" --auto --merge             || echo "::warning::could not enable auto-merge on #$num — merge it manually"

      # Consumers pin `@v1`; keep it tracking the latest v1.x.x. Runs only when
      # release-please actually cut a release. `tag_name` and `sha` are
      # root-component outputs (unprefixed, path "."); `sha` is the exact commit
      # the release was tagged at, so we move the major ref to it directly — no
      # getCommit read to hit the ref-eventual-consistency window. Values are
      # passed via env, never interpolated into the script body, so a crafted
      # tag can't inject into the JS.
      - name: Advance the major tag
        if: ${{ steps.release.outputs.release_created == 'true' }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag_name }}
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        with:
          script: |
            const tag = process.env.RELEASE_TAG || "";
            const sha = process.env.RELEASE_SHA || "";
            // Only STABLE vMAJOR.MINOR.PATCH releases move the major tag. Anchored
            // at the end ($) so a prerelease (e.g. v1.5.0-rc.1) never force-moves a
            // stable `vX` ref onto unreleased code that `@vX` consumers would run.
            const m = tag.match(/^v(\d+)\.\d+\.\d+$/);
            if (!m || !sha) {
              core.info(`Release "${tag || "(none)"}" @ "${sha || "(none)"}" is not a stable vMAJOR.MINOR.PATCH release — leaving the major tag unchanged.`);
              return;
            }
            const major = `v${m[1]}`;
            const ref = `tags/${major}`;
            try {
              await github.rest.git.updateRef({ owner: context.repo.owner, repo: context.repo.repo, ref, sha, force: true });
              core.info(`Moved ${major} -> ${sha.slice(0, 12)}`);
            } catch (err) {
              // Only "ref does not exist yet" (first release of a new major) falls
              // back to createRef. A 403 (org token/ref policy), 5xx, or rate limit
              // must surface, not be masked by a misleading "already exists".
              if (err.status !== 404 && err.status !== 422) throw err;
              await github.rest.git.createRef({ owner: context.repo.owner, repo: context.repo.repo, ref: `refs/${ref}`, sha });
              core.info(`Created ${major} -> ${sha.slice(0, 12)}`);
            }
