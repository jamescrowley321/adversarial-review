version: 2
updates:
  # Keep the GitHub Actions this action depends on current (clears Node-version
  # deprecations automatically). Grouped so it's one PR, not one per action.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    # Don't propose a bump until a release has been public for a week — newly
    # published action versions can be malicious or get yanked/repointed.
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
    groups:
      github-actions:
        patterns: ["*"]
